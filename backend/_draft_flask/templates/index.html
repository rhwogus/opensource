<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>냉장고 레시피</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="layout">
    <section class="panel ingredients-panel">
      <h1>냉장고 재료</h1>
      <form id="ingredient-form" class="ingredient-form">
        <input type="text" id="ingredient-input" placeholder="예: 계란, 양파" autocomplete="off" />
        <button type="submit">추가</button>
      </form>
      <ul id="ingredient-list" class="ingredient-list"></ul>
      <button type="button" id="recommend-btn" class="primary-btn">레시피 추천</button>
    </section>

    <section class="panel results-panel">
      <h2>추천 레시피</h2>
      <div id="recipe-cards" class="recipe-cards"></div>
    </section>

    <section class="panel chat-panel">
      <h2>요리 도우미</h2>
      <div id="chat-messages" class="chat-messages"></div>
    </section>
  </main>

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
